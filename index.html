<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Bank</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f1e8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
    }

    .resource {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .buttons button {
      width: 45px;
      margin: 0;
      padding: 10px;
    }

    .count {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    #game {
      display: none;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏝️ Board Bank</h1>

  <div id="setup" class="card">
    <h2>Crear partida</h2>

    <input
      id="playerName"
      type="text"
      placeholder="Tu nombre"
    >

    <button onclick="createGame()">
      Crear partida
    </button>

    <div id="setupMessage"></div>
  </div>

  <div id="game">

    <div class="card">
      <h2>Partida</h2>
      <p>
        Código:
        <strong id="gameCode"></strong>
      </p>

      <p>
        Jugador:
        <strong id="currentPlayer"></strong>
      </p>
    </div>

    <div class="card">
      <h2>🏦 Banco</h2>
      <div id="bank"></div>
    </div>

    <div class="card">
      <h2>🎒 Mis recursos</h2>
      <div id="resources"></div>
    </div>

  </div>

</div>

<script>

  // =========================================================
  // SUPABASE
  // =========================================================

  const SUPABASE_URL = https://sjbpaexicqkswrlqgfoj.supabase.co;
  const SUPABASE_KEY = sb_publishable_puFoRi_x7b6oSsvStPcdAw_YDRPdeYy;

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // =========================================================
  // VARIABLES
  // =========================================================

  let gameId = null;
  let playerId = null;

  const resourceNames = {
    wood: "🌲 Madera",
    brick: "🧱 Arcilla",
    wheat: "🌾 Trigo",
    sheep: "🐑 Oveja",
    ore: "⛏️ Mineral"
  };


  // =========================================================
  // CREAR PARTIDA
  // =========================================================

  async function createGame() {

    const nameInput = document.getElementById("playerName");
    const message = document.getElementById("setupMessage");

    const name = nameInput.value.trim();

    if (!name) {
      message.innerHTML =
        '<div class="error">Escribe tu nombre.</div>';
      return;
    }

    message.innerHTML = "Creando partida...";

    try {

      const code = Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

      const { data: game, error: gameError } =
        await supabaseClient
          .from("games")
          .insert({
            code: code
          })
          .select()
          .single();

      if (gameError) {
        throw gameError;
      }

      gameId = game.id;

      const { data: player, error: playerError } =
        await supabaseClient
          .from("players")
          .insert({
            game_id: gameId,
            name: name
          })
          .select()
          .single();

      if (playerError) {
        throw playerError;
      }

      playerId = player.id;

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";

      document.getElementById("gameCode").textContent = code;
      document.getElementById("currentPlayer").textContent = name;

      await loadGame();

      subscribeToGame();

    } catch (error) {

      console.error(error);

      message.innerHTML =
        '<div class="error">No se pudo crear la partida. Revisa la conexión con Supabase.</div>';
    }
  }


  // =========================================================
  // CARGAR PARTIDA
  // =========================================================

  async function loadGame() {

    await loadBank();
    await loadResources();

  }


  // =========================================================
  // BANCO
  // =========================================================

  async function loadBank() {

    const { data, error } =
      await supabaseClient
        .from("resource_cards")
        .select("resource_type")
        .eq("game_id", gameId)
        .is("owner_player_id", null);

    if (error) {
      console.error(error);
      return;
    }

    const counts = {
      wood: 0,
      brick: 0,
      wheat: 0,
      sheep: 0,
      ore: 0
    };

    data.forEach(card => {
      counts[card.resource_type]++;
    });

    const bank = document.getElementById("bank");

    bank.innerHTML = "";

    for (const resource in counts) {

      bank.innerHTML += `
        <div class="resource">
          <span>${resourceNames[resource]}</span>
          <strong>${counts[resource]}</strong>
        </div>
      `;
    }
  }


  // =========================================================
  // MIS RECURSOS
  // =========================================================

  async function loadResources() {

    const { data, error } =
      await supabaseClient
        .from("resource_cards")
        .select("resource_type")
        .eq("game_id", gameId)
        .eq("owner_player_id", playerId);

    if (error) {
      console.error(error);
      return;
    }

    const counts = {
      wood: 0,
      brick: 0,
      wheat: 0,
      sheep: 0,
      ore: 0
    };

    data.forEach(card => {
      counts[card.resource_type]++;
    });

    const resources = document.getElementById("resources");

    resources.innerHTML = "";

    for (const resource in counts) {

      resources.innerHTML += `
        <div class="resource">

          <span>${resourceNames[resource]}</span>

          <div class="buttons">

            <button onclick="takeResource('${resource}')">
              +
            </button>

            <span class="count">
              ${counts[resource]}
            </span>

            <button onclick="returnResource('${resource}')">
              −
            </button>

          </div>

        </div>
      `;
    }
  }


  // =========================================================
  // TOMAR RECURSO
  // =========================================================

  async function takeResource(resource) {

    const { data, error } =
      await supabaseClient
        .from("resource_cards")
        .select("id")
        .eq("game_id", gameId)
        .eq("resource_type", resource)
        .is("owner_player_id", null)
        .limit(1);

    if (error || !data || data.length === 0) {
      return;
    }

    const cardId = data[0].id;

    await supabaseClient
      .from("resource_cards")
      .update({
        owner_player_id: playerId
      })
      .eq("id", cardId);

    await loadGame();
  }


  // =========================================================
  // DEVOLVER RECURSO
  // =========================================================

  async function returnResource(resource) {

    const { data, error } =
      await supabaseClient
        .from("resource_cards")
        .select("id")
        .eq("game_id", gameId)
        .eq("resource_type", resource)
        .eq("owner_player_id", playerId)
        .limit(1);

    if (error || !data || data.length === 0) {
      return;
    }

    const cardId = data[0].id;

    await supabaseClient
      .from("resource_cards")
      .update({
        owner_player_id: null
      })
      .eq("id", cardId);

    await loadGame();
  }


  // =========================================================
  // ACTUALIZACIÓN EN TIEMPO REAL
  // =========================================================

  function subscribeToGame() {

    supabaseClient
      .channel("game-" + gameId)

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "resource_cards",
          filter: "game_id=eq." + gameId
        },
        async () => {
          await loadGame();
        }
      )

      .subscribe();
  }

</script>

</body>
</html>
